logging:
  level.root: INFO
  level.no.fdk: ${LOG_LEVEL:INFO}
  level.org.springframework: WARN
  level.org.springframework.web: WARN
server:
  port: 8080
application:
  scope: ${MASKINPORTEN_SCOPE}
  conceptCatalogBaseURI: ${CONCEPT_CATALOG_BASE_URI}
  postgresql:
    conceptCatalog:
      url: jdbc:postgresql://${POSTGRESQL_HOST}:${POSTGRESQL_PORT:5432}/${POSTGRESQL_CONCEPT_DB}
      username: ${POSTGRESQL_CONCEPT_USER}
      password: ${POSTGRESQL_CONCEPT_PASSWORD}
    adminService:
      url: jdbc:postgresql://${POSTGRESQL_HOST}:${POSTGRESQL_PORT:5432}/${POSTGRESQL_ADMIN_DB}
      username: ${POSTGRESQL_ADMIN_USER}
      password: ${POSTGRESQL_ADMIN_PASSWORD}
  elastic:
    username: ${ELASTIC_USERNAME}
    password: ${ELASTIC_PASSWORD}
    host: ${ELASTIC_HOST}
    ssl: ${ELASTIC_SSL:true}
    storePath: ${ELASTIC_KEYSTORE_PATH}
    storePass: ${ELASTIC_KEYSTORE_PASSWORD}

spring:
  security.oauth2.resourceserver.jwt:
    jwk-set-uri: ${MASKINPORTEN_JWK:https://test.maskinporten.no/jwk}
    issuer-uri: ${MASKINPORTEN_ISSUER:https://test.maskinporten.no/}
---
spring:
  config.activate.on-profile: develop
  security.oauth2.resourceserver.jwt.jwk-set-uri: https://sso.staging.fellesdatakatalog.digdir.no/auth/realms/fdk/protocol/openid-connect/certs
application:
  scope: test.scope
  postgresql:
    conceptCatalog:
      url: jdbc:postgresql://localhost:5432/concept_catalog
      username: admin
      password: admin
    adminService:
      url: jdbc:postgresql://localhost:5433/catalog_admin_service
      username: admin
      password: admin
  elastic:
    username: elastic
    password: elasticpwd
    host: localhost
    ssl: false
---
spring:
  config.activate.on-profile: test
  security.oauth2.resourceserver.jwt:
    jwk-set-uri: http://localhost:5050/jwk
    issuer-uri: http://localhost:5050/
application:
  scope: test.scope
  conceptCatalogBaseURI: http://localhost:5555
  postgresql:
    conceptCatalog:
      url: jdbc:postgresql://localhost:5432/concept_catalog
      username: testuser
      password: testpassword
    adminService:
      url: jdbc:postgresql://localhost:5433/catalog_admin_service
      username: testuser
      password: testpassword
  elastic:
    username: elastic
    password: elasticpwd
    ssl: false
    storePass: keystore
