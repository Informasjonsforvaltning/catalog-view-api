---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-view-api
  labels:
    app: catalog-view-api
spec:
  template:
    spec:
      containers:
        - name: catalog-view-api
          env:
            - name: MASKINPORTEN_ISSUER
              valueFrom:
                secretKeyRef:
                  name: maskinporten
                  key: MASKINPORTEN_ISSUER
            - name: MASKINPORTEN_JWK
              valueFrom:
                secretKeyRef:
                  name: maskinporten
                  key: MASKINPORTEN_JWK
            - name: MASKINPORTEN_SCOPE
              valueFrom:
                secretKeyRef:
                  name: maskinporten
                  key: MASKINPORTEN_SCOPE
            - name: POSTGRESQL_HOST
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: HOST
            - name: POSTGRESQL_PORT
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: PORT
            - name: POSTGRESQL_CONCEPT_DB
              valueFrom:
                secretKeyRef:
                  name: catalog-view-api
                  key: POSTGRESQL_CONCEPT_DB
            - name: POSTGRESQL_CONCEPT_USER
              valueFrom:
                secretKeyRef:
                  name: catalog-view-api
                  key: POSTGRESQL_CONCEPT_USER
            - name: POSTGRESQL_CONCEPT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-view-api
                  key: POSTGRESQL_CONCEPT_PASSWORD
            - name: POSTGRESQL_ADMIN_DB
              valueFrom:
                secretKeyRef:
                  name: catalog-view-api
                  key: POSTGRESQL_ADMIN_DB
            - name: POSTGRESQL_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: catalog-view-api
                  key: POSTGRESQL_ADMIN_USER
            - name: POSTGRESQL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-view-api
                  key: POSTGRESQL_ADMIN_PASSWORD
            - name: ELASTIC_KEYSTORE_PATH
              value: /var/secrets/elastic/keystores/keystore.jks
            - name: ELASTIC_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-view-api
                  key: KEYSTORE_PASSWORD
            - name: ELASTIC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: catalog-view-api
                  key: ELASTIC_USER
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-view-api
                  key: ELASTIC_PASSWORD
            - name: ELASTIC_HOST
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-es
                  key: ELASTIC_HOST
            - name: CONCEPT_CATALOG_BASE_URI
              valueFrom:
                secretKeyRef:
                  name: commonurl
                  key: CONCEPT_CATALOG_BASE_URI
